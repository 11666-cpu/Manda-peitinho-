<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pra você 🖤</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Press Start 2P', cursive;
  background: black;
  overflow: hidden;
}

/* ===== TV INICIAL ===== */
#start {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.tv {
  width: 90%;
  max-width: 400px;
  border: 8px solid #ff4da6;
  box-shadow: 0 0 30px #ff4da6;
  border-radius: 20px;
  padding: 10px;
}

.screen {
  background: linear-gradient(#5c94fc, #1d2b53);
  height: 300px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
}

/* ===== CRT ===== */
#crt {
  display: none;
  color: #ff4da6;
  height: 100vh;
  overflow-y: auto;
  padding: 20px;
}

.container {
  border: 6px solid #ff4da6;
  padding: 20px;
}

#texto {
  font-size: 9px;
  line-height: 1.8;
}

/* corações */
.heart {
  position: fixed;
  top: -20px;
  font-size: 12px;
  color: #ff4da6;
  animation: cair linear;
}

@keyframes cair {
  from { transform: translateY(-50px); }
  to { transform: translateY(110vh); }
}
</style>
</head>

<body>

<!-- TELA INICIAL -->
<div id="start">
  <div class="tv">
    <div class="screen">
      <h3>🎮 START 🎮</h3>
      <p>clique para jogar<br>minha mamãe 💖</p>
      <button id="btn">JOGAR</button>
    </div>
  </div>

  <audio id="mario" loop>
    <source src="Super Mario Bros. - Overworld Theme(MP3_160K).mp3" type="audio/mpeg">
  </audio>
</div>

<!-- CRT -->
<div id="crt">
  <div class="container">
    <div id="texto"></div>
  </div>

  <audio id="musica" loop>
    <source src="_Great Fairy_s Fountain_ from Zelda but slowed and reverb (8D audio)(MP3_160K).mp3" type="audio/mpeg">
  </audio>

  <audio id="type">
    <source src="Som de uma Máquina de escrever(MP3_160K).mp3" type="audio/mpeg">
  </audio>
</div>

<script>
const btn = document.getElementById("btn");
const start = document.getElementById("start");
const crt = document.getElementById("crt");

const mario = document.getElementById("mario");
const musica = document.getElementById("musica");
const type = document.getElementById("type");

let i = 0;

const textoCompleto = `
Eu nem sei explicar direito como você conseguiu se tornar tudo isso pra mim.

Mas toda vez que eu escuto The Smiths…
é impossível não pensar em você.

Cada música, cada letra, cada sentimento…
tudo me lembra você de alguma forma.

E eu fico ali, pensando no quanto você é incrível,
no quanto você é única,
no quanto você é diferente de tudo que eu já conheci.

Você é linda.
Maravilhosa.
Perfeita do seu jeito.

Você é minha paz,
minha felicidade,
minha pessoa favorita nesse mundo inteiro.

E não importa o que aconteça,
eu sempre vou lembrar de você
como a melhor coisa que já me aconteceu.

Minha neném…
minha gostosinha…
minha mamãe…

Eu te amo. 🖤
`;

/* inicia música mario no primeiro toque */
document.body.addEventListener("click", () => {
  mario.play().catch(()=>{});
}, { once: true });

/* botão funcional */
btn.addEventListener("click", () => {
  start.style.display = "none";
  crt.style.display = "block";

  mario.pause();

  musica.currentTime = 0;
  musica.play().catch(()=>{});

  digitar();
  setInterval(criarCoracao, 500);
});

/* digitação lenta */
function digitar() {
  if (i < textoCompleto.length) {
    document.getElementById("texto").innerHTML += textoCompleto.charAt(i);

    try {
      type.currentTime = 0;
      type.play();
    } catch {}

    i++;
    setTimeout(digitar, 70);
  }
}

/* corações */
function criarCoracao() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (Math.random() * 4 + 3) + "s";

  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}
</script>

</body>
</html>
