<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pra você 🖤</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Press Start 2P', cursive;
  background: black;
  overflow: hidden;
}

/* TV */
#start {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.tv {
  width: 90%;
  max-width: 400px;
  border: 8px solid #ff4da6;
  box-shadow: 0 0 30px #ff4da6;
  border-radius: 20px;
  padding: 10px;
}

.screen {
  background: linear-gradient(#5c94fc, #1d2b53);
  height: 300px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
}

/* CRT */
#crt {
  display: none;
  color: #ff4da6;
  height: 100vh;
  overflow-y: auto;
  padding: 20px;
}

.container {
  border: 6px solid #ff4da6;
  padding: 20px;
}

#texto {
  font-size: 9px;
}

/* coração */
.heart {
  position: fixed;
  top: -20px;
  animation: cair linear;
}

@keyframes cair {
  from { transform: translateY(-50px); }
  to { transform: translateY(110vh); }
}
</style>
</head>

<body>

<div id="start">
  <div class="tv">
    <div class="screen">
      <h3>🎮 START 🎮</h3>
      <button id="btn">JOGAR</button>
    </div>
  </div>

  <audio id="mario" loop>
    <source src="Super Mario Bros. - Overworld Theme(MP3_160K).mp3">
  </audio>
</div>

<div id="crt">
  <div class="container">
    <div id="texto"></div>
  </div>

  <audio id="musica" loop>
    <source src="_Great Fairy_s Fountain_ from Zelda but slowed and reverb (8D audio)(MP3_160K).mp3">
  </audio>

  <audio id="type">
    <source src="Som de uma Máquina de escrever(MP3_160K).mp3">
  </audio>
</div>

<script>
const btn = document.getElementById("btn");

btn.addEventListener("click", iniciar);

const texto = "Você é a melhor coisa da minha vida 🖤";
let i = 0;

function iniciar() {
  console.log("clicou");

  document.getElementById("start").style.display = "none";
  document.getElementById("crt").style.display = "block";

  document.getElementById("mario").pause();

  const musica = document.getElementById("musica");
  musica.play().catch(err => console.log("erro musica", err));

  digitar();
}

function digitar() {
  if (i < texto.length) {
    document.getElementById("texto").innerHTML += texto.charAt(i);

    const som = document.getElementById("type");
    som.currentTime = 0;
    som.play().catch(()=>{});

    i++;
    setTimeout(digitar, 80);
  }
}
</script>

</body>
</html>
