<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pra você 🖤</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Press Start 2P', cursive;
  background: black;
  overflow: hidden;
}

/* ===== TELA INICIAL ===== */
#start {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: linear-gradient(#5c94fc, #1d2b53);
  color: white;
  text-align: center;
}

#start button {
  margin-top: 20px;
  padding: 15px;
  background: #ff4da6;
  border: none;
  color: white;
  cursor: pointer;
}

/* ===== CRT ===== */
#crt {
  display: none;
  color: #ff4da6;
  height: 100vh;
  overflow-y: auto;
  padding: 20px;
}

#crt::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.03),
    rgba(255,255,255,0.03) 1px,
    transparent 1px,
    transparent 3px
  );
}

.container {
  border: 6px solid #ff4da6;
  padding: 20px;
  box-shadow: 0 0 20px #ff4da6;
}

#texto {
  font-size: 9px;
  line-height: 1.8;
  text-shadow: 0 0 5px #ff4da6;
}

/* corações */
.heart {
  position: fixed;
  top: -20px;
  font-size: 12px;
  color: #ff4da6;
  animation: cair linear;
}

@keyframes cair {
  from { transform: translateY(-50px); }
  to { transform: translateY(110vh); }
}
</style>
</head>

<body>

<!-- TELA INICIAL -->
<div id="start">
  <h2>🎮 CLIQUE PARA JOGAR 🎮</h2>
  <p>minha mamãe 💖</p>
  <button onclick="iniciar()">COMEÇAR</button>

  <!-- música mario -->
  <audio id="mario" loop>
    <source src="Super Mario Bros. - Overworld Theme(MP3_160K).mp3" type="audio/mpeg">
  </audio>
</div>

<!-- CRT -->
<div id="crt">
  <div class="container">
    <div id="texto"></div>
  </div>

  <!-- música principal -->
  <audio id="musica" loop>
    <source src="8-Bit Great Fairy_s Fountain Theme (The Legend of Zelda_ Ocarina of Time)(MP3_160K).mp3" type="audio/mpeg">
  </audio>

  <!-- som digitação -->
  <audio id="type">
    <source src="Som de uma Máquina de escrever(MP3_160K).mp3" type="audio/mpeg">
  </audio>
</div>

<script>
const textoCompleto = `
Eu nem sei explicar direito como você conseguiu se tornar tudo isso pra mim.

Mas toda vez que eu escuto The Smiths…
é impossível não pensar em você.

Cada música, cada letra, cada sentimento…
tudo me lembra você de alguma forma.

E eu fico ali, pensando no quanto você é incrível,
no quanto você é única,
no quanto você é diferente de tudo que eu já conheci.

Você é linda.
Maravilhosa.
Perfeita do seu jeito.

Você é minha paz,
minha felicidade,
minha pessoa favorita nesse mundo inteiro.

E não importa o que aconteça,
eu sempre vou lembrar de você
como a melhor coisa que já me aconteceu.

Minha neném…
minha gostosinha…
minha mamãe…

Eu te amo. 🖤
`;

let i = 0;

function iniciar() {
  document.getElementById("start").style.display = "none";
  document.getElementById("crt").style.display = "block";

  // para música mario
  const mario = document.getElementById("mario");
  mario.pause();

  // começa música principal
  const musica = document.getElementById("musica");
  musica.play().catch(()=>{});

  digitar();
  setInterval(criarCoracao, 500);
}

// toca mario só quando usuário interagir
document.addEventListener("click", () => {
  const mario = document.getElementById("mario");
  mario.play().catch(()=>{});
}, { once: true });

function digitar() {
  if (i < textoCompleto.length) {
    document.getElementById("texto").innerHTML += textoCompleto.charAt(i);

    const som = document.getElementById("type");
    som.currentTime = 0;
    som.play().catch(()=>{});

    i++;
    setTimeout(digitar, 30);
  }
}

function criarCoracao() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (Math.random() * 4 + 3) + "s";

  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 7000);
}
</script>

</body>
</html>
